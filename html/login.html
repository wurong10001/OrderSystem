<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="订单系统登录" />
    <title>登录 - OrderSystem</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body data-page="login">
    <main class="auth-layout">
      <section class="auth-intro">
        <p class="eyebrow">ORDERSYSTEM</p>
        <h1>管理每一笔订单，<span>从容有序。</span></h1>
        <p class="intro-copy">登录后查看订单状态，处理库存与通知流程。</p>
      </section>

      <section class="auth-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">OS</div>
        <p class="card-kicker">欢迎回来</p>
        <h2 id="page-title">登录账户</h2>
        <p class="card-description">输入用户名和密码继续</p>

        <form id="auth-form" novalidate>
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username"
            placeholder="请输入用户名" minlength="3" maxlength="32" required />

          <label for="password">密码</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" placeholder="请输入密码" minlength="8" required />

          <button id="submit-button" type="submit">登录</button>
          <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
        </form>

        <p class="switch-page">还没有账户？<a href="/register">立即注册</a></p>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
