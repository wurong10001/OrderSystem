<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理</title>
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .order-list { margin-top: 20px; }
    .order-card {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .order-id { font-weight: 600; font-size: 15px; }
    .order-status {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      background: #fff3cd;
      color: #856404;
    }
    .order-status.accepted { background: #d1ecf1; color: #0c5460; }
    .order-status.completed { background: #d4edda; color: #155724; }
    .order-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .order-items { font-size: 13px; color: #444; line-height: 1.7; }
    .order-total { font-size: 16px; font-weight: 700; color: #e74c3c; margin-top: 8px; }
    .order-actions { margin-top: 12px; display: flex; gap: 8px; }
    .btn-accept {
      padding: 8px 16px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .nav-links { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav-links a { color: #667eea; text-decoration: none; font-size: 14px; }
    .nav-links a:hover { text-decoration: underline; }
    .message { padding: 12px; border-radius: 6px; margin-bottom: 16px; text-align: center; }
    .message.success { background: #d4edda; color: #155724; }
    .message.error { background: #f8d7da; color: #721c24; }
    .empty { text-align: center; color: #999; padding: 40px 0; }
  </style>
</head>
<body data-page="admin-orders">
  <div class="auth-container">
    <h1>订单管理</h1>
    <div id="message" class="message" hidden></div>
    <div id="role-hint" style="font-size:13px;color:#666;margin-bottom:12px;"></div>
    <div id="order-list" class="order-list">
      <p class="empty">加载中...</p>
    </div>
    <div class="nav-links">
      <a href="/admin/menu">菜单管理</a>
      <a href="/admin/users">用户管理</a>
      <a href="#" id="logout-link">退出登录</a>
    </div>
  </div>

  <script src="/js/admin-orders.js"></script>
</body>
</html>
