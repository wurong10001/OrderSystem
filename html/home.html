<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味餐厅</title>
  <style>
    /* SECTION: styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #171717;
      --muted: #77736d;
      --line: rgba(23, 23, 23, .09);
      --paper: #f7f6f2;
      --accent: #ff5c35;
      --shadow: 0 12px 34px rgba(35, 29, 22, .08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }
    .header {
      background: rgba(247, 246, 242, .78);
      padding: 24px 20px 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--line);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
      backdrop-filter: blur(20px) saturate(1.15);
    }
    .header h1 { font-size: 21px; color: var(--ink); font-weight: 750; letter-spacing: -.035em; }
    .header p { font-size: 13px; color: var(--muted); margin-top: 5px; }
    
    .category-tabs {
      background: rgba(255, 255, 255, .72);
      display: flex;
      overflow-x: auto;
      padding: 12px 16px;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab {
      padding: 8px 16px;
      background: rgba(23, 23, 23, .06);
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      scroll-snap-align: start;
      transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
    }
    .category-tab:active { transform: scale(0.96); }
    .category-tab.active {
      background: #333;
      color: #fff;
      font-weight: 600;
    }
    
    .menu-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 14px 24px;
    }
    
    .menu-item {
      background: #fff;
      border: 1px solid rgba(23, 23, 23, .06);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: transform 220ms cubic-bezier(.22, 1, .36, 1), box-shadow 220ms ease;
      will-change: transform;
    }
    .menu-item:active { transform: scale(.985); box-shadow: 0 8px 20px rgba(35, 29, 22, .06); }
    
    .menu-item-image {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      background: #ebe8e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .menu-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .menu-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .menu-item-name { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 5px; }
    .menu-item-desc { font-size: 13px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
    .menu-item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-item-price { font-size: 18px; color: var(--accent); font-weight: 750; }
    .menu-item-price::before { content: '¥'; font-size: 14px; }
    
    .add-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(23, 23, 23, .16);
      transition: transform 180ms cubic-bezier(.22, 1, .36, 1), background-color 180ms ease;
    }
    .add-btn:active { background: #000; transform: scale(.9); }
    
    /* SECTION: modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, .34);
      opacity: 0;
      transition: opacity 360ms ease;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-overlay.is-open { opacity: 1; }
    
    .modal {
      background: #fff;
      border-radius: 26px 26px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 12px 20px calc(22px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 360ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }
    .modal-overlay.is-open .modal { transform: translateY(0); }
    .modal-overlay.is-dragging .modal { transition: none; }
    .modal-overlay.is-closing { pointer-events: none; }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      touch-action: none;
      min-height: 34px;
    }
    .sheet-grabber {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: rgba(23, 23, 23, .16);
      transform: translateX(-50%);
    }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(23, 23, 23, .06);
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    
    .modal-item-info {
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .modal-item-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #ebe8e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .modal-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .modal-item-detail { flex: 1; }
    .modal-item-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .modal-item-desc { font-size: 13px; color: #666; margin-bottom: 8px; }
    .modal-item-price { font-size: 20px; color: var(--accent); font-weight: 750; }
    .modal-item-price::before { content: '¥'; font-size: 14px; }
    
    .attribute-group {
      margin-bottom: 20px;
    }
    .attribute-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .attribute-label .required {
      color: #ff4d4f;
      font-size: 12px;
    }
    
    .option-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .option-item {
      padding: 10px 16px;
      background: rgba(23, 23, 23, .06);
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
      border: 2px solid transparent;
    }
    .option-item.selected {
      background: rgba(255, 92, 53, .1);
      border-color: var(--accent);
      color: var(--ink);
      font-weight: 500;
    }
    .option-item:active { transform: scale(0.95); }
    
    .quantity-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 0;
    }
    .qty-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(23, 23, 23, .06);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .qty-btn:active:not(:disabled) { background: #e0e0e0; }
    .qty-value { font-size: 20px; font-weight: 600; min-width: 40px; text-align: center; }
    
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .modal-total { font-size: 14px; color: #666; }
    .modal-total-price { font-size: 24px; color: #ff4d4f; font-weight: 700; }
    .modal-total-price::before { content: '¥'; font-size: 16px; }
    
    .add-to-cart-btn {
      padding: 14px 32px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 23, 23, .16);
      transition: transform 180ms cubic-bezier(.22, 1, .36, 1), background-color 180ms ease;
    }
    .add-to-cart-btn:active { background: #000; transform: scale(.97); }
    
    /* SECTION: cart-bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(23, 23, 23, .94);
      color: #fff;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-icon { position: relative; font-size: 24px; }
    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      transform: scale(1);
      transform-origin: center;
      transition: transform 180ms ease;
      will-change: transform;
    }
    .cart-badge.is-changing { transform: scale(1.2); }
    .cart-total { font-size: 18px; font-weight: 600; }
    .checkout-btn {
      padding: 12px 24px;
      background: transparent;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .checkout-btn:disabled { background: #777; cursor: not-allowed; }
    .checkout-btn:active:not(:disabled) { background: #000; transform: scale(.97); }

    .cart-flyer {
      position: fixed;
      z-index: 500;
      pointer-events: none;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      transform-origin: center;
      transition: transform 420ms cubic-bezier(.22, 1, .36, 1), opacity 420ms ease;
      will-change: transform, opacity;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    
    /* SECTION: responsive */
    @media (max-width: 400px) {
      .menu-item { padding: 12px; }
      .menu-item-image { width: 80px; height: 80px; }
      .menu-item-name { font-size: 15px; }
      .menu-item-price { font-size: 16px; }
    }
  </style>
</head>
<body>
  <!-- SECTION: header -->
  <header class="header">
    <h1 id="store-name">美味餐厅</h1>
  </header>

  <!-- SECTION: category-tabs -->
  <div class="category-tabs" id="category-tabs">
    <div class="category-tab active" data-category="all">全部</div>
  </div>

  <!-- SECTION: menu-list -->
  <main class="menu-container" id="menu-list">
    <div class="empty-state">
      <div class="empty-state-icon">🍽️</div>
      <p>加载中...</p>
    </div>
  </main>

  <!-- SECTION: item-modal -->
  <div class="modal-overlay" id="item-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <span class="sheet-grabber" aria-hidden="true"></span>
        <span class="modal-title">选择规格</span>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      
      <div class="modal-item-info">
        <div class="modal-item-image" id="modal-image">🍽️</div>
        <div class="modal-item-detail">
          <div class="modal-item-name" id="modal-name"></div>
          <div class="modal-item-desc" id="modal-desc"></div>
          <div class="modal-item-price" id="modal-price"></div>
        </div>
      </div>
      
      <div id="modal-attributes"></div>
      
      <div class="quantity-selector">
        <button class="qty-btn" id="qty-minus" disabled>−</button>
        <span class="qty-value" id="qty-value">1</span>
        <button class="qty-btn" id="qty-plus">+</button>
      </div>
      
      <div class="modal-footer">
        <div>
          <div class="modal-total">合计</div>
          <div class="modal-total-price" id="modal-total">0</div>
        </div>
        <button class="add-to-cart-btn" id="add-to-cart-btn" data-primary-action>加入购物车</button>
      </div>
    </div>
  </div>

  <!-- SECTION: cart-bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-icon">
        🛒
        <span class="cart-badge" id="cart-badge" hidden>0</span>
      </span>
      <span class="cart-total" id="cart-total">¥0</span>
    </div>
    <button class="checkout-btn" id="checkout-btn" disabled data-primary-action>去下单</button>
  </div>

  <script>
    /* SECTION: state */
    let menuItems = [];
    let cart = {};
    let currentItem = null;
    let selectedOptions = {};
    let quantity = 1;
    let modalDrag = null;
    let modalCloseTimer = null;

    /* SECTION: cookie-helpers */
    function setCookie(name, value, days = 1) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Strict`;
    }
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }
    function saveCart() {
      setCookie('cart', JSON.stringify(cart), 7);
    }
    function loadCart() {
      try {
        const saved = getCookie('cart');
        if (saved) cart = JSON.parse(saved);
      } catch (e) { cart = {}; }
    }

    /* SECTION: render-menu */
    function renderCategories() {
      const categories = [...new Set(menuItems.map(item => item.category).filter(Boolean))];
      document.getElementById('category-tabs').innerHTML = [
        '<div class="category-tab active" data-category="all">全部</div>',
        ...categories.map(category =>
          `<div class="category-tab" data-category="${escapeHtml(category)}">${escapeHtml(category)}</div>`
        )
      ].join('');
    }

    function renderMenu(filter = 'all') {
      const container = document.getElementById('menu-list');
      const filtered = filter === 'all' ? menuItems : menuItems.filter(item => item.category === filter);
      
      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🍽️</div>
            <p>暂无菜品</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filtered.map(item => `
        <div class="menu-item" data-id="${item.id}">
          <div class="menu-item-image">
            ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.name)}">` : '🍽️'}
          </div>
          <div class="menu-item-info">
            <div>
              <div class="menu-item-name">${escapeHtml(item.name)}</div>
              <div class="menu-item-desc">${escapeHtml(item.description || '美味可口')}</div>
            </div>
            <div class="menu-item-bottom">
              <span class="menu-item-price">${Number(item.price).toFixed(0)}</span>
              <button class="add-btn" data-action="add" data-id="${item.id}">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* SECTION: modal */
    function openModal(itemId) {
      currentItem = menuItems.find(i => i.id == itemId);
      if (!currentItem) return;
      
      selectedOptions = {};
      quantity = 1;
      
      document.getElementById('modal-name').textContent = currentItem.name;
      document.getElementById('modal-desc').textContent = currentItem.description || '美味可口';
      document.getElementById('modal-price').textContent = Number(currentItem.price).toFixed(0);
      
      const imageEl = document.getElementById('modal-image');
      if (currentItem.image_url) {
        imageEl.innerHTML = `<img src="${escapeHtml(currentItem.image_url)}" alt="${escapeHtml(currentItem.name)}">`;
      } else {
        imageEl.innerHTML = '🍽️';
      }
      
      renderAttributes();
      updateModalTotal();
      
      document.getElementById('qty-value').textContent = quantity;
      document.getElementById('qty-minus').disabled = true;
      const overlay = document.getElementById('item-modal');
      clearTimeout(modalCloseTimer);
      overlay.hidden = false;
      overlay.classList.remove('is-closing');
      overlay.querySelector('.modal').style.removeProperty('transform');
      requestAnimationFrame(() => overlay.classList.add('is-open'));
    }

    function renderAttributes() {
      const container = document.getElementById('modal-attributes');
      if (!currentItem.attributes || !currentItem.attributes.length) {
        container.innerHTML = '';
        return;
      }
      
      container.innerHTML = currentItem.attributes.map(attr => `
        <div class="attribute-group">
          <div class="attribute-label">
            ${escapeHtml(attr.name)}
            ${attr.required ? '<span class="required">必选</span>' : ''}
          </div>
          <div class="option-list">
            ${attr.options.map(opt => `
              <div class="option-item" data-attr="${attr.id}" data-option="${opt.id}">
                ${escapeHtml(opt.value)}
                ${opt.priceAdjustment > 0 ? ` +¥${Number(opt.priceAdjustment).toFixed(0)}` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      
      // Bind option click events
      container.querySelectorAll('.option-item').forEach(el => {
        el.addEventListener('click', () => {
          const attrId = el.dataset.attr;
          const optionId = el.dataset.option;
          
          // Deselect others in same attribute
          container.querySelectorAll(`.option-item[data-attr="${attrId}"]`).forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
          
          selectedOptions[attrId] = optionId;
          updateModalTotal();
        });
      });
    }

    function updateModalTotal() {
      let total = Number(currentItem.price);
      
      // Add price adjustments
      if (currentItem.attributes) {
        for (const attr of currentItem.attributes) {
          const selectedOptionId = selectedOptions[attr.id];
          if (selectedOptionId) {
            const option = attr.options.find(o => o.id == selectedOptionId);
            if (option) total += Number(option.priceAdjustment);
          }
        }
      }
      
      total *= quantity;
      document.getElementById('modal-total').textContent = total.toFixed(0);
    }

    function closeModal() {
      const overlay = document.getElementById('item-modal');
      if (overlay.hidden || overlay.classList.contains('is-closing')) return;
      overlay.classList.remove('is-open', 'is-dragging');
      overlay.classList.add('is-closing');
      modalCloseTimer = setTimeout(() => {
        overlay.hidden = true;
        overlay.classList.remove('is-closing');
        overlay.querySelector('.modal').style.removeProperty('transform');
      }, 360);
      currentItem = null;
      selectedOptions = {};
      quantity = 1;
    }

    function animateItemToCart(itemId) {
      const source = document.querySelector(`.menu-item[data-id="${CSS.escape(String(itemId))}"] .menu-item-image`);
      const target = document.querySelector('.cart-icon');
      if (!source || !target || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const sourceRect = source.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const flyer = source.cloneNode(true);
      flyer.className = 'cart-flyer';
      flyer.style.left = `${sourceRect.left}px`;
      flyer.style.top = `${sourceRect.top}px`;
      flyer.style.width = `${sourceRect.width}px`;
      flyer.style.height = `${sourceRect.height}px`;
      document.body.appendChild(flyer);
      requestAnimationFrame(() => {
        flyer.style.transform =
          `translate(${targetRect.left - sourceRect.left + targetRect.width / 2 - sourceRect.width / 2}px, ` +
          `${targetRect.top - sourceRect.top + targetRect.height / 2 - sourceRect.height / 2}px) scale(.24)`;
        flyer.style.opacity = '0.35';
      });
      flyer.addEventListener('transitionend', () => flyer.remove(), { once: true });
    }

    /* SECTION: cart-operations */
    function addToCart() {
      if (!currentItem) return;
      
      // Validate required attributes
      if (currentItem.attributes) {
        for (const attr of currentItem.attributes) {
          if (attr.required && !selectedOptions[attr.id]) {
            alert(`请选择${attr.name}`);
            return;
          }
        }
      }
      
      const cartKey = `${currentItem.id}_${Object.values(selectedOptions).sort().join('_')}`;
      
      if (!cart[cartKey]) {
        cart[cartKey] = {
          id: currentItem.id,
          name: currentItem.name,
          price: Number(currentItem.price),
          quantity: 0,
          options: { ...selectedOptions },
          optionNames: {}
        };
        
        // Store option names
        if (currentItem.attributes) {
          for (const attr of currentItem.attributes) {
            const selectedOptionId = selectedOptions[attr.id];
            if (selectedOptionId) {
              const option = attr.options.find(o => o.id == selectedOptionId);
              if (option) {
                cart[cartKey].optionNames[attr.name] = option.value;
                cart[cartKey].price += Number(option.priceAdjustment);
              }
            }
          }
        }
      }
      
      cart[cartKey].quantity += quantity;
      saveCart();
      updateCartBar();
      animateItemToCart(currentItem.id);
      closeModal();
    }

    function updateCartBar() {
      const badge = document.getElementById('cart-badge');
      const total = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');
      
      const itemCount = Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);
      
      if (itemCount > 0) {
        badge.textContent = itemCount;
        badge.hidden = false;
        checkoutBtn.disabled = false;
      } else {
        badge.hidden = true;
        checkoutBtn.disabled = true;
      }
      total.textContent = '¥' + totalPrice.toFixed(0);
      badge.classList.remove('is-changing');
      if (itemCount > 0) {
        requestAnimationFrame(() => badge.classList.add('is-changing'));
      }
    }

    /* SECTION: fetch-menu */
    async function fetchMenu() {
      try {
        const response = await fetch('/api/menu/items');
        if (!response.ok) throw new Error('获取菜单失败');
        menuItems = await response.json();
        renderCategories();
        renderMenu();
        updateCartBar();
      } catch (error) {
        document.getElementById('menu-list').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    /* SECTION: fetch-store-name */
    async function fetchStoreName() {
      try {
        const response = await fetch('/api/store/settings');
        if (response.ok) {
          const settings = await response.json();
          if (settings.store_name) {
            document.getElementById('store-name').textContent = settings.store_name;
          }
        }
      } catch (e) { /* use default name */ }
    }

    /* SECTION: event-listeners */
    document.getElementById('menu-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action="add"]');
      if (btn) {
        openModal(btn.dataset.id);
      }
    });

    document.getElementById('category-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.category-tab');
      if (!tab) return;
      document.querySelectorAll('.category-tab').forEach(item => item.classList.remove('active'));
      tab.classList.add('active');
      renderMenu(tab.dataset.category);
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('item-modal').addEventListener('click', (e) => {
      if (e.target.id === 'item-modal') closeModal();
    });

    const modal = document.querySelector('#item-modal .modal');
    const modalHeader = document.querySelector('#item-modal .modal-header');
    modalHeader.style.cursor = 'grab';
    modalHeader.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      const overlay = document.getElementById('item-modal');
      const startTransform = modal.getBoundingClientRect().top;
      modalDrag = { pointerId: event.pointerId, startY: event.clientY, startTop: startTransform };
      overlay.classList.add('is-dragging');
      modalHeader.setPointerCapture(event.pointerId);
    });
    modalHeader.addEventListener('pointermove', (event) => {
      if (!modalDrag || event.pointerId !== modalDrag.pointerId) return;
      const offset = Math.max(0, event.clientY - modalDrag.startY);
      modal.style.transform = `translateY(${offset}px)`;
    });
    modalHeader.addEventListener('pointerup', (event) => {
      if (!modalDrag || event.pointerId !== modalDrag.pointerId) return;
      const offset = Math.max(0, event.clientY - modalDrag.startY);
      const overlay = document.getElementById('item-modal');
      modalDrag = null;
      overlay.classList.remove('is-dragging');
      if (offset > Math.min(180, window.innerHeight * 0.22)) {
        modal.style.removeProperty('transform');
        closeModal();
      } else {
        modal.style.removeProperty('transform');
        overlay.classList.add('is-open');
      }
    });
    modalHeader.addEventListener('pointercancel', () => {
      if (!modalDrag) return;
      modalDrag = null;
      document.getElementById('item-modal').classList.remove('is-dragging');
      modal.style.removeProperty('transform');
      document.getElementById('item-modal').classList.add('is-open');
    });

    document.getElementById('qty-minus').addEventListener('click', () => {
      if (quantity > 1) {
        quantity--;
        document.getElementById('qty-value').textContent = quantity;
        document.getElementById('qty-minus').disabled = quantity <= 1;
        updateModalTotal();
      }
    });

    document.getElementById('qty-plus').addEventListener('click', () => {
      quantity++;
      document.getElementById('qty-value').textContent = quantity;
      document.getElementById('qty-minus').disabled = false;
      updateModalTotal();
    });

    document.getElementById('add-to-cart-btn').addEventListener('click', addToCart);

    document.getElementById('checkout-btn').addEventListener('click', () => {
      window.location.href = '/ordering';
    });

    /* SECTION: init */
    loadCart();
    fetchStoreName();
    fetchMenu();
  </script>
</body>
</html>
