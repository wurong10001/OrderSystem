<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员菜单</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="admin-menu">
  <div class="auth-container">
    <h1>管理员菜单</h1>
    <div id="menu-list" class="menu-list"></div>
    <div class="form-actions">
      <button type="button" id="add-item-btn" class="btn-primary">添加菜品</button>
      <a href="/admin/users" style="padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 6px; display: inline-block;">用户管理</a>
      <button type="button" id="logout-btn" class="btn-secondary">退出登录</button>
    </div>
  </div>

  <div id="item-modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title">添加菜品</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="item-name">菜品名称</label>
          <input type="text" id="item-name" name="name" required>
        </div>
        <div class="form-group">
          <label for="item-description">描述（可选）</label>
          <textarea id="item-description" name="description"></textarea>
        </div>
        <div class="form-group">
          <label for="item-price">价格</label>
          <input type="number" id="item-price" name="price" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label for="item-sort">排序</label>
          <input type="number" id="item-sort" name="sortOrder" value="0">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="item-active" name="active" checked>
            上架
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" id="cancel-btn" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin-menu.js"></script>
</body>
</html>
