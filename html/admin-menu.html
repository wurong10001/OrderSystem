<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员菜单</title>
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .menu-list { margin-top: 20px; }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .menu-item-info { flex: 1; }
    .menu-item-name { font-weight: 600; font-size: 16px; }
    .menu-item-desc { font-size: 13px; color: #666; margin-top: 4px; }
    .menu-item-price { color: #e74c3c; font-weight: 600; margin-top: 4px; }
    .menu-item-status { font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    .menu-item-status.active { background: #d4edda; color: #155724; }
    .menu-item-status.inactive { background: #f8d7da; color: #721c24; }
    .menu-item-actions { display: flex; gap: 8px; }
    .btn-edit, .btn-delete, .btn-attrs {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-edit { background: #667eea; color: white; }
    .btn-delete { background: #e74c3c; color: white; }
    .btn-attrs { background: #28a745; color: white; }
    .form-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn-primary { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn-secondary { padding: 12px 24px; background: #6c757d; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-content { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #666; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    
    .attr-list { margin-top: 16px; }
    .attr-item {
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .attr-header { display: flex; justify-content: space-between; align-items: center; }
    .attr-name { font-weight: 600; }
    .attr-required { font-size: 12px; color: #e74c3c; }
    .attr-options { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd; }
    .attr-option { display: inline-block; padding: 4px 12px; background: #fff; border-radius: 12px; font-size: 13px; margin: 4px 4px 4px 0; }
    
    .nav-links { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav-links a { color: #667eea; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body data-page="admin-menu">
  <div class="auth-container">
    <h1>管理员菜单</h1>
    <div id="menu-list" class="menu-list">
      <p style="text-align:center;color:#999;">加载中...</p>
    </div>
    <div class="form-actions">
      <button type="button" id="add-item-btn" class="btn-primary">添加菜品</button>
      <a href="/admin/users" style="padding: 12px 24px; background: #6c757d; color: white; text-decoration: none; border-radius: 8px; display: inline-block; font-size: 14px;">用户管理</a>
      <button type="button" id="logout-btn" class="btn-secondary">退出登录</button>
    </div>
  </div>

  <!-- Item Modal -->
  <div id="item-modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title">添加菜品</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="item-name">菜品名称</label>
          <input type="text" id="item-name" name="name" required>
        </div>
        <div class="form-group">
          <label for="item-description">描述（可选）</label>
          <textarea id="item-description" name="description"></textarea>
        </div>
        <div class="form-group">
          <label for="item-price">价格</label>
          <input type="number" id="item-price" name="price" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label for="item-image">图片URL（可选）</label>
          <input type="url" id="item-image" name="imageUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="item-sort">排序</label>
          <input type="number" id="item-sort" name="sortOrder" value="0">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="item-active" name="active" checked>
            上架
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" id="cancel-btn" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Attributes Modal -->
  <div id="attrs-modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="attrs-title">菜品属性</h2>
      <p id="attrs-item-name" style="color:#666;margin-bottom:16px;"></p>
      
      <div id="attrs-list" class="attr-list"></div>
      
      <div style="margin-top:16px;">
        <button type="button" id="add-attr-btn" class="btn-primary">添加属性</button>
      </div>
      
      <div class="form-actions" style="margin-top:20px;">
        <button type="button" id="close-attrs-btn" class="btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <!-- Add Attribute Modal -->
  <div id="add-attr-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>添加属性</h2>
      <form id="attr-form">
        <div class="form-group">
          <label for="attr-name">属性名称</label>
          <input type="text" id="attr-name" name="name" placeholder="如：辣度、温度、加料" required>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="attr-required" name="required">
            必选
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">添加</button>
          <button type="button" id="cancel-attr-btn" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Option Modal -->
  <div id="add-option-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>添加选项</h2>
      <form id="option-form">
        <div class="form-group">
          <label for="option-value">选项值</label>
          <input type="text" id="option-value" name="value" placeholder="如：微辣、中辣、特辣" required>
        </div>
        <div class="form-group">
          <label for="option-price">价格调整（可选）</label>
          <input type="number" id="option-price" name="priceAdjustment" step="0.01" value="0" placeholder="0">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">添加</button>
          <button type="button" id="cancel-option-btn" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin-menu.js"></script>
</body>
</html>
