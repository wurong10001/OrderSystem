<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .user-list {
      margin-top: 20px;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .user-name {
      font-weight: 600;
      font-size: 16px;
    }
    .user-role-label {
      font-size: 12px;
      color: #666;
    }
    .role-select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    .role-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .nav-links {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      text-align: center;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
    }
    .current-user-badge {
      font-size: 11px;
      background: #667eea;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }
  </style>
</head>
<body data-page="admin-users">
  <div class="auth-container">
    <h1>用户管理</h1>
    <div id="message" class="message" hidden></div>
    <div id="user-list" class="user-list">
      <p style="text-align: center; color: #999;">加载中...</p>
    </div>
    <div class="nav-links">
      <a href="/admin/menu">← 返回菜单管理</a>
      <a href="#" id="logout-link">退出登录</a>
    </div>
  </div>

  <script src="/js/admin-users.js"></script>
</body>
</html>
