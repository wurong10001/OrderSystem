<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美味餐厅</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* SECTION: styles */
    :root {
      --ink: #171717;
      --muted: #77736d;
      --line: rgba(23, 23, 23, .09);
      --paper: #f7f6f2;
      --accent: #ff5c35;
      --accent-light: rgba(255, 92, 53, .1);
      --shadow: 0 12px 34px rgba(35, 29, 22, .08);
      --shadow-sm: 0 4px 12px rgba(35, 29, 22, .06);
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --spacing-xxl: 40px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(80px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    /* Header */
    .header {
      background: rgba(247, 246, 242, .82);
      padding: 16px 20px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--line);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
      backdrop-filter: blur(20px) saturate(1.15);
    }
    .header h1 {
      font-size: 19px;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: -.03em;
    }

    /* Category Tabs */
    .category-tabs {
      background: rgba(255, 255, 255, .72);
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab {
      padding: 8px 18px;
      background: rgba(23, 23, 23, .05);
      border-radius: var(--radius-full);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      scroll-snap-align: start;
      min-height: 36px;
      display: flex;
      align-items: center;
      transition: transform 180ms ease, background-color 200ms ease, color 200ms ease, box-shadow 200ms ease;
      user-select: none;
    }
    .category-tab:active { transform: scale(0.95); }
    .category-tab.active {
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(23, 23, 23, .15);
    }

    /* Menu Container */
    .menu-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 14px 24px;
    }

    /* Menu Item Card */
    .menu-item {
      background: #fff;
      border: 1px solid rgba(23, 23, 23, .04);
      border-radius: var(--radius-xl);
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 200ms cubic-bezier(.22, 1, .36, 1), box-shadow 200ms ease;
      will-change: transform;
      cursor: pointer;
    }
    .menu-item:active {
      transform: scale(.98);
      box-shadow: 0 6px 16px rgba(35, 29, 22, .05);
    }

    .menu-item-image {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      background: #ebe8e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .menu-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .menu-item-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .menu-item-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .menu-item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-item-price {
      font-size: 18px;
      color: var(--accent);
      font-weight: 750;
    }
    .menu-item-price::before { content: '¥'; font-size: 13px; margin-right: 1px; }

    .add-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(23, 23, 23, .16);
      transition: transform 180ms cubic-bezier(.22, 1, .36, 1), background-color 180ms ease;
      flex-shrink: 0;
    }
    .add-btn:active { background: #000; transform: scale(.88); }

    /* SECTION: modal - Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, .34);
      opacity: 0;
      transition: opacity 320ms ease;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-overlay.is-open { opacity: 1; }

    .modal {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      max-height: 85dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 20px calc(24px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 320ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
      -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.is-open .modal { transform: translateY(0); }
    .modal-overlay.is-dragging .modal { transition: none !important; }
    .modal-overlay.is-closing { pointer-events: none; }
    .modal-overlay.is-closing .modal {
      transition: transform 280ms cubic-bezier(.4, 0, 1, 1);
      transform: translateY(100%);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 8px;
      touch-action: none;
      min-height: 40px;
      position: relative;
    }
    .sheet-grabber {
      position: absolute;
      top: -4px;
      left: 50%;
      width: 36px;
      height: 5px;
      border-radius: 99px;
      background: rgba(23, 23, 23, .14);
      transform: translateX(-50%);
    }
    .modal-title { font-size: 17px; font-weight: 600; }
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(23, 23, 23, .06);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease;
    }
    .modal-close:active { background: rgba(23, 23, 23, .12); }

    .modal-item-info {
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .modal-item-image {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      background: #ebe8e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .modal-item-image img { width: 100%; height: 100%; object-fit: cover; }
    .modal-item-detail { flex: 1; min-width: 0; }
    .modal-item-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .modal-item-desc { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.5; }
    .modal-item-price { font-size: 20px; color: var(--accent); font-weight: 750; }
    .modal-item-price::before { content: '¥'; font-size: 14px; }

    .attribute-group { margin-bottom: 20px; }
    .attribute-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .attribute-label .required { color: #ff4d4f; font-size: 12px; }

    .option-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-item {
      padding: 10px 18px;
      background: rgba(23, 23, 23, .05);
      border-radius: var(--radius-full);
      font-size: 14px;
      cursor: pointer;
      transition: transform 150ms ease, background-color 200ms ease, border-color 200ms ease;
      border: 2px solid transparent;
      min-height: 40px;
      display: flex;
      align-items: center;
      user-select: none;
    }
    .option-item.selected {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--ink);
      font-weight: 500;
    }
    .option-item:active { transform: scale(0.95); }

    .quantity-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px 0;
    }
    .qty-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(23, 23, 23, .06);
      border: none;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, transform 150ms ease;
      user-select: none;
    }
    .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .qty-btn:active:not(:disabled) { background: #e0e0e0; transform: scale(0.92); }
    .qty-value {
      font-size: 22px;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid #eee;
      gap: 16px;
    }
    .modal-total { font-size: 13px; color: #999; }
    .modal-total-price {
      font-size: 24px;
      color: #ff4d4f;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    .modal-total-price::before { content: '¥'; font-size: 16px; }

    .add-to-cart-btn {
      padding: 14px 32px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23, 23, 23, .18);
      transition: transform 180ms cubic-bezier(.22, 1, .36, 1), background-color 180ms ease;
      white-space: nowrap;
      min-height: 48px;
    }
    .add-to-cart-btn:active { background: #000; transform: scale(.96); }

    /* SECTION: cart-bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(23, 23, 23, .94);
      color: #fff;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-icon { position: relative; font-size: 26px; display: flex; align-items: center; }
    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      transform: scale(1);
      transform-origin: center;
      transition: transform 200ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }
    .cart-badge.is-changing { transform: scale(1.25); }
    .cart-total {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .checkout-btn {
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease;
      min-height: 44px;
    }
    .checkout-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
    .checkout-btn:active:not(:disabled) { transform: scale(.96); }

    /* Fly animation */
    .cart-flyer {
      position: fixed;
      z-index: 500;
      pointer-events: none;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      transform-origin: center;
      will-change: transform, opacity;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      padding: 12px 24px;
      background: rgba(0,0,0,0.78);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 14px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      max-width: 280px;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Responsive */
    @media (max-width: 400px) {
      .menu-item { padding: 12px; gap: 12px; }
      .menu-item-image { width: 84px; height: 84px; }
      .menu-item-name { font-size: 15px; }
      .menu-item-price { font-size: 16px; }
      .add-btn { width: 34px; height: 34px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <!-- SECTION: header -->
  <header class="header">
    <h1 id="store-name">美味餐厅</h1>
  </header>

  <!-- SECTION: category-tabs -->
  <div class="category-tabs" id="category-tabs">
    <div class="category-tab active" data-category="all">全部</div>
  </div>

  <!-- SECTION: menu-list -->
  <main class="menu-container" id="menu-list">
    <div class="empty-state">
      <div class="empty-state-icon">🍽️</div>
      <p>加载中...</p>
    </div>
  </main>

  <!-- SECTION: item-modal -->
  <div class="modal-overlay" id="item-modal" hidden>
    <div class="modal">
      <div class="modal-header" id="modal-header">
        <span class="sheet-grabber" aria-hidden="true"></span>
        <span class="modal-title">选择规格</span>
        <button class="modal-close" id="modal-close" aria-label="关闭">
          <span class="material-icons" style="font-size:20px">close</span>
        </button>
      </div>

      <div class="modal-item-info">
        <div class="modal-item-image" id="modal-image">🍽️</div>
        <div class="modal-item-detail">
          <div class="modal-item-name" id="modal-name"></div>
          <div class="modal-item-desc" id="modal-desc"></div>
          <div class="modal-item-price" id="modal-price"></div>
        </div>
      </div>

      <div id="modal-attributes"></div>

      <div class="quantity-selector">
        <button class="qty-btn" id="qty-minus" disabled aria-label="减少数量">
          <span class="material-icons" style="font-size:22px">remove</span>
        </button>
        <span class="qty-value" id="qty-value">1</span>
        <button class="qty-btn" id="qty-plus" aria-label="增加数量">
          <span class="material-icons" style="font-size:22px">add</span>
        </button>
      </div>

      <div class="modal-footer">
        <div>
          <div class="modal-total">合计</div>
          <div class="modal-total-price" id="modal-total">0</div>
        </div>
        <button class="add-to-cart-btn" id="add-to-cart-btn" data-primary-action>加入购物车</button>
      </div>
    </div>
  </div>

  <!-- SECTION: cart-bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-icon">
        🛒
        <span class="cart-badge" id="cart-badge" hidden>0</span>
      </span>
      <span class="cart-total" id="cart-total">¥0</span>
    </div>
    <button class="checkout-btn" id="checkout-btn" disabled data-primary-action>去下单</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    /* SECTION: state */
    let menuItems = [];
    let cart = {};
    let currentItem = null;
    let selectedOptions = {};
    let quantity = 1;
    let modalDrag = null;
    let modalCloseTimer = null;
    let activeFlyers = [];

    /* SECTION: toast */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* SECTION: cookie-helpers */
    function setCookie(name, value, days = 1) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Strict`;
    }
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }
    function saveCart() {
      setCookie('cart', JSON.stringify(cart), 7);
    }
    function loadCart() {
      try {
        const saved = getCookie('cart');
        if (saved) cart = JSON.parse(saved);
      } catch (e) { cart = {}; }
    }

    /* SECTION: render-menu */
    function renderCategories() {
      const categories = [...new Set(menuItems.map(item => item.category).filter(Boolean))];
      document.getElementById('category-tabs').innerHTML = [
        '<div class="category-tab active" data-category="all">全部</div>',
        ...categories.map(category =>
          `<div class="category-tab" data-category="${escapeHtml(category)}">${escapeHtml(category)}</div>`
        )
      ].join('');
    }

    function renderMenu(filter = 'all') {
      const container = document.getElementById('menu-list');
      const filtered = filter === 'all' ? menuItems : menuItems.filter(item => item.category === filter);

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🍽️</div>
            <p>暂无菜品</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="menu-item" data-id="${item.id}">
          <div class="menu-item-image">
            ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.name)}" loading="lazy">` : '🍽️'}
          </div>
          <div class="menu-item-info">
            <div>
              <div class="menu-item-name">${escapeHtml(item.name)}</div>
              <div class="menu-item-desc">${escapeHtml(item.description || '美味可口')}</div>
            </div>
            <div class="menu-item-bottom">
              <span class="menu-item-price">${Number(item.price).toFixed(0)}</span>
              <button class="add-btn" data-action="add" data-id="${item.id}" aria-label="添加${escapeHtml(item.name)}">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* SECTION: modal */
    const overlay = document.getElementById('item-modal');
    const modal = overlay.querySelector('.modal');
    const modalHeader = document.getElementById('modal-header');

    function openModal(itemId) {
      currentItem = menuItems.find(i => i.id == itemId);
      if (!currentItem) return;

      selectedOptions = {};
      quantity = 1;

      document.getElementById('modal-name').textContent = currentItem.name;
      document.getElementById('modal-desc').textContent = currentItem.description || '美味可口';
      document.getElementById('modal-price').textContent = Number(currentItem.price).toFixed(0);

      const imageEl = document.getElementById('modal-image');
      if (currentItem.image_url) {
        imageEl.innerHTML = `<img src="${escapeHtml(currentItem.image_url)}" alt="${escapeHtml(currentItem.name)}">`;
      } else {
        imageEl.innerHTML = '🍽️';
      }

      renderAttributes();
      updateModalTotal();

      document.getElementById('qty-value').textContent = quantity;
      document.getElementById('qty-minus').disabled = true;

      clearTimeout(modalCloseTimer);
      overlay.hidden = false;
      overlay.classList.remove('is-closing', 'is-dragging');
      modal.style.removeProperty('transform');
      // Force reflow then open
      void overlay.offsetHeight;
      requestAnimationFrame(() => overlay.classList.add('is-open'));
    }

    function renderAttributes() {
      const container = document.getElementById('modal-attributes');
      if (!currentItem.attributes || !currentItem.attributes.length) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = currentItem.attributes.map(attr => `
        <div class="attribute-group">
          <div class="attribute-label">
            ${escapeHtml(attr.name)}
            ${attr.required ? '<span class="required">必选</span>' : ''}
          </div>
          <div class="option-list">
            ${attr.options.map(opt => `
              <div class="option-item" data-attr="${attr.id}" data-option="${opt.id}">
                ${escapeHtml(opt.value)}
                ${opt.priceAdjustment > 0 ? ` +¥${Number(opt.priceAdjustment).toFixed(0)}` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.option-item').forEach(el => {
        el.addEventListener('click', () => {
          const attrId = el.dataset.attr;
          const optionId = el.dataset.option;
          container.querySelectorAll(`.option-item[data-attr="${attrId}"]`).forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
          selectedOptions[attrId] = optionId;
          updateModalTotal();
        });
      });
    }

    function updateModalTotal() {
      let total = Number(currentItem.price);
      if (currentItem.attributes) {
        for (const attr of currentItem.attributes) {
          const selectedOptionId = selectedOptions[attr.id];
          if (selectedOptionId) {
            const option = attr.options.find(o => o.id == selectedOptionId);
            if (option) total += Number(option.priceAdjustment);
          }
        }
      }
      total *= quantity;
      document.getElementById('modal-total').textContent = total.toFixed(0);
    }

    function closeModal() {
      if (overlay.hidden || overlay.classList.contains('is-closing')) return;

      // Clean up any active drag
      if (modalDrag) {
        modalDrag = null;
        overlay.classList.remove('is-dragging');
      }

      overlay.classList.remove('is-open');
      overlay.classList.add('is-closing');

      modalCloseTimer = setTimeout(() => {
        overlay.hidden = true;
        overlay.classList.remove('is-closing');
        modal.style.removeProperty('transform');
      }, 300);

      currentItem = null;
      selectedOptions = {};
      quantity = 1;
    }

    /* SECTION: modal-drag - 可交互动画（支持打断） */
    modalHeader.style.cursor = 'grab';

    modalHeader.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      // Ignore if clicking on close button
      if (event.target.closest('.modal-close')) return;

      const startTop = modal.getBoundingClientRect().top;
      modalDrag = {
        pointerId: event.pointerId,
        startY: event.clientY,
        startTop: startTop
      };
      overlay.classList.add('is-dragging');
      modalHeader.setPointerCapture(event.pointerId);
      modalHeader.style.cursor = 'grabbing';
    });

    modalHeader.addEventListener('pointermove', (event) => {
      if (!modalDrag || event.pointerId !== modalDrag.pointerId) return;
      const delta = Math.max(0, event.clientY - modalDrag.startY);
      modal.style.transform = `translateY(${delta}px)`;
    });

    modalHeader.addEventListener('pointerup', (event) => {
      if (!modalDrag || event.pointerId !== modalDrag.pointerId) return;
      const delta = Math.max(0, event.clientY - modalDrag.startY);
      const threshold = Math.min(180, window.innerHeight * 0.22);

      modalDrag = null;
      modalHeader.style.cursor = 'grab';

      if (delta > threshold) {
        // 关闭：先保持当前位置，再分帧触发动画
        overlay.classList.remove('is-dragging');
        // 确保当前位移作为起始值
        modal.style.transform = `translateY(${delta}px)`;
        requestAnimationFrame(() => {
          closeModal();
        });
      } else if (delta > 0) {
        // 回弹：关键修复 —— 分帧处理，让浏览器感知到"旧值"
        overlay.classList.remove('is-dragging');
        // 第1帧：保持当前位移（transition 已恢复，但值未变，不触发）
        // 第2帧：设置目标值，触发 transition 回弹动画
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            modal.style.transform = 'translateY(0)';
          });
        });
      } else {
        overlay.classList.remove('is-dragging');
      }
    });

    modalHeader.addEventListener('pointercancel', () => {
      if (!modalDrag) return;
      modalDrag = null;
      modalHeader.style.cursor = 'grab';
      // 回弹修复：同样分帧
      overlay.classList.remove('is-dragging');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          modal.style.transform = 'translateY(0)';
        });
      });
    });

    /* SECTION: fly-to-cart animation */
    function animateItemToCart(itemId) {
      const source = document.querySelector(`.menu-item[data-id="${CSS.escape(String(itemId))}"] .menu-item-image`);
      const target = document.querySelector('.cart-icon');
      if (!source || !target || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const sourceRect = source.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();

      const flyer = source.cloneNode(true);
      flyer.className = 'cart-flyer';
      flyer.style.left = `${sourceRect.left}px`;
      flyer.style.top = `${sourceRect.top}px`;
      flyer.style.width = `${sourceRect.width}px`;
      flyer.style.height = `${sourceRect.height}px`;
      document.body.appendChild(flyer);

      // 记录到活跃动画列表，支持清理
      activeFlyers.push(flyer);

      const dx = targetRect.left - sourceRect.left + targetRect.width / 2 - sourceRect.width / 2;
      const dy = targetRect.top - sourceRect.top + targetRect.height / 2 - sourceRect.height / 2;

      // 双 rAF 确保浏览器已渲染初始帧
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          flyer.style.transition = 'transform 420ms cubic-bezier(.22, 1, .36, 1), opacity 420ms ease';
          flyer.style.transform = `translate(${dx}px, ${dy}px) scale(.24)`;
          flyer.style.opacity = '0.35';
        });
      });

      const cleanup = () => {
        flyer.remove();
        activeFlyers = activeFlyers.filter(f => f !== flyer);
      };
      flyer.addEventListener('transitionend', cleanup, { once: true });
      // 兜底：防止 transitionend 不触发
      setTimeout(cleanup, 600);
    }

    /* SECTION: cart-operations */
    function addToCart() {
      if (!currentItem) return;

      if (currentItem.attributes) {
        for (const attr of currentItem.attributes) {
          if (attr.required && !selectedOptions[attr.id]) {
            showToast(`请选择${attr.name}`);
            return;
          }
        }
      }

      const cartKey = `${currentItem.id}_${Object.values(selectedOptions).sort().join('_')}`;

      if (!cart[cartKey]) {
        cart[cartKey] = {
          id: currentItem.id,
          name: currentItem.name,
          price: Number(currentItem.price),
          quantity: 0,
          options: { ...selectedOptions },
          optionNames: {}
        };

        if (currentItem.attributes) {
          for (const attr of currentItem.attributes) {
            const selectedOptionId = selectedOptions[attr.id];
            if (selectedOptionId) {
              const option = attr.options.find(o => o.id == selectedOptionId);
              if (option) {
                cart[cartKey].optionNames[attr.name] = option.value;
                cart[cartKey].price += Number(option.priceAdjustment);
              }
            }
          }
        }
      }

      cart[cartKey].quantity += quantity;
      saveCart();
      updateCartBar();
      animateItemToCart(currentItem.id);
      closeModal();
    }

    function updateCartBar() {
      const badge = document.getElementById('cart-badge');
      const total = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');

      const itemCount = Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);

      if (itemCount > 0) {
        badge.textContent = itemCount;
        badge.hidden = false;
        checkoutBtn.disabled = false;
      } else {
        badge.hidden = true;
        checkoutBtn.disabled = true;
      }
      total.textContent = '¥' + totalPrice.toFixed(0);

      // Badge bounce
      badge.classList.remove('is-changing');
      if (itemCount > 0) {
        requestAnimationFrame(() => badge.classList.add('is-changing'));
        setTimeout(() => badge.classList.remove('is-changing'), 250);
      }
    }

    /* SECTION: fetch-menu */
    async function fetchMenu() {
      try {
        const response = await fetch('/api/menu/items');
        if (!response.ok) throw new Error('获取菜单失败');
        menuItems = await response.json();
        renderCategories();
        renderMenu();
        updateCartBar();
      } catch (error) {
        document.getElementById('menu-list').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    /* SECTION: fetch-store-name */
    async function fetchStoreName() {
      try {
        const response = await fetch('/api/store/settings');
        if (response.ok) {
          const settings = await response.json();
          if (settings.store_name) {
            document.getElementById('store-name').textContent = settings.store_name;
          }
        }
      } catch (e) { /* use default name */ }
    }

    /* SECTION: event-listeners */
    document.getElementById('menu-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action="add"]');
      if (btn) {
        openModal(btn.dataset.id);
      }
    });

    document.getElementById('category-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.category-tab');
      if (!tab) return;
      document.querySelectorAll('.category-tab').forEach(item => item.classList.remove('active'));
      tab.classList.add('active');
      renderMenu(tab.dataset.category);
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target.id === 'item-modal') closeModal();
    });

    document.getElementById('qty-minus').addEventListener('click', () => {
      if (quantity > 1) {
        quantity--;
        document.getElementById('qty-value').textContent = quantity;
        document.getElementById('qty-minus').disabled = quantity <= 1;
        updateModalTotal();
      }
    });

    document.getElementById('qty-plus').addEventListener('click', () => {
      quantity++;
      document.getElementById('qty-value').textContent = quantity;
      document.getElementById('qty-minus').disabled = false;
      updateModalTotal();
    });

    document.getElementById('add-to-cart-btn').addEventListener('click', addToCart);

    document.getElementById('checkout-btn').addEventListener('click', () => {
      window.location.href = '/ordering';
    });

    // 防止模态框打开时背景滚动
    overlay.addEventListener('touchmove', (e) => {
      if (e.target === modal || modal.contains(e.target)) {
        // 允许模态框内部滚动
        return;
      }
      e.preventDefault();
    }, { passive: false });

    /* SECTION: init */
    loadCart();
    fetchStoreName();
    fetchMenu();
  </script>
</body>
</html>
